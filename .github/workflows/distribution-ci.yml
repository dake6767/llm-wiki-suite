name: distribution-ci

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'registry/**'
      - 'scripts/**'
      - 'skills/**'
      - 'apps/my-llm-wiki-browser/crates/llm-wiki-setup/**'
      - '.github/workflows/distribution-ci.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'scripts/**'
      - 'skills/**'
      - 'apps/my-llm-wiki-browser/crates/llm-wiki-setup/**'
      - '.github/workflows/distribution-ci.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  setup-core:
    name: Setup Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/my-llm-wiki-browser
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/my-llm-wiki-browser -> target
      - run: cargo test -p llm-wiki-setup

  skills-and-manifest:
    name: Skills and manifest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release inputs
        run: |
          python -m json.tool registry/pack-build-posix.lock.json
          python -m json.tool registry/pack-build-windows.lock.json
          python -m json.tool registry/pack-release.json
          python -m json.tool registry/opencli/package-lock.json
          python -m json.tool skills/my-llm-wiki/references/toolchain.json
          python -m scripts.pack_release metadata
          python -m scripts.check_pack_release_version --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          python -m scripts.build_distribution --help
      - name: Compile and test Provider/pack code
        run: |
          python -m compileall -q scripts skills
          python -m unittest scripts.test_distribution
          python -m unittest discover -s skills/my-llm-wiki/scripts -p "test_*.py"
          python -m unittest discover -s skills/my-llm-wiki-video/scripts -p "test_*.py"
      - name: Check approval-clean examples
        run: python scripts/check_approval_safety.py
