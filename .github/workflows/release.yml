name: release

# Tag releases publish the Browser, standalone CLI, updater manifest, and one
# jointly tested distribution manifest. Large immutable runtime packs live in a
# prerelease named packs-v<pack_version> and are built only once per pack input
# revision. workflow_dispatch builds everything as an unpublished smoke test.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve and validate one release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
          else
            release_tag="v-ci"
          fi
          RELEASE_TAG="$release_tag" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path("apps/my-llm-wiki-browser")
          cargo = re.search(
              r'^version\s*=\s*"([^"]+)"',
              (root / "Cargo.toml").read_text(),
              re.MULTILINE,
          ).group(1)
          versions = {
              "Cargo workspace": cargo,
              "Tauri": json.loads(
                  (root / "desktop/src-tauri/tauri.conf.json").read_text()
              )["version"],
              "frontend": json.loads(
                  (root / "frontend/package.json").read_text()
              )["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"release versions differ: {versions}")
          tag = os.environ["RELEASE_TAG"]
          if tag != "v-ci" and tag != f"v{cargo}":
              raise SystemExit(f"tag {tag!r} does not match v{cargo}")
          print(f"release_tag={tag}")
          print(f"version={cargo}")
          PY

  create-release:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create a clean draft application release
        id: create
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            let release = releases.find((row) => row.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`refusing to mutate published release ${tag}`);
            }
            if (release) {
              const assets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  per_page: 100,
                },
              );
              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
              core.info(`reusing clean draft release ${release.id} for ${tag}`);
            } else {
              ({ data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `My LLM Wiki ${tag}`,
                body: 'My LLM Wiki 2 将安装、更新与修复统一到 Browser 内置 Setup Core。首次启动可安装完整 Skills Pack、官方验证工具链并初始化 Wiki；Skills 也可独立使用系统或自定义 Provider。所有平台使用同一 distribution manifest 与不可变 SHA-256 pack，不在用户机器上调用 pip、npm、brew、apt 或 winget。ASR 能力包按需下载。产物尚未做 Apple 公证 / Windows Authenticode 代码签名：macOS 首次运行按系统提示到 隐私与安全性 → 仍要打开；Windows SmartScreen 选择仍要运行。',
                draft: true,
                prerelease: false,
              }));
            }
            core.setOutput('release_id', String(release.id));

  prepare-pack-release:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      build_packs: ${{ steps.prepare.outputs.build_packs }}
      pack_tag: ${{ steps.metadata.outputs.pack_tag }}
      pack_version: ${{ steps.metadata.outputs.pack_version }}
      input_sha256: ${{ steps.metadata.outputs.input_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate immutable pack release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(python -m scripts.pack_release metadata)"
          echo "pack_version=$(jq -r .version <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "pack_tag=$(jq -r .tag <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "input_sha256=$(jq -r .input_sha256 <<<"$metadata")" >> "$GITHUB_OUTPUT"
      - name: Reuse a published pack release or create a clean draft
        id: prepare
        uses: actions/github-script@v9
        env:
          PACK_TAG: ${{ steps.metadata.outputs.pack_tag }}
        with:
          script: |
            if (!context.ref.startsWith('refs/tags/')) {
              core.setOutput('release_id', '');
              core.setOutput('build_packs', 'true');
              return;
            }
            const tag = process.env.PACK_TAG;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            let release = releases.find((row) => row.tag_name === tag);
            if (release && !release.draft) {
              if (!release.prerelease) {
                throw new Error(`pack release ${tag} must be a prerelease`);
              }
              core.setOutput('release_id', String(release.id));
              core.setOutput('build_packs', 'false');
              core.info(`reusing immutable pack release ${release.id}`);
              return;
            }
            if (release) {
              const assets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  per_page: 100,
                },
              );
              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            } else {
              ({ data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `My LLM Wiki Runtime Packs ${tag}`,
                body: 'Immutable, fully locked runtime packs referenced by application distribution manifests.',
                draft: true,
                prerelease: true,
              }));
            }
            core.setOutput('release_id', String(release.id));
            core.setOutput('build_packs', 'true');

  build-distribution-packs:
    needs: [validate-release, prepare-pack-release]
    if: needs.prepare-pack-release.outputs.build_packs == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            packs: toolchain-base,asr-zh,asr-other
          - os: macos-15
            artifact: darwin-arm64
            packs: toolchain-base,asr-zh,asr-other
          - os: macos-15-intel
            artifact: darwin-x64
            packs: toolchain-base,asr-other
          - os: windows-latest
            artifact: windows-x64
            packs: toolchain-base,asr-zh,asr-other
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: Build and postcheck immutable distribution packs
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          while true; do
            if python -m scripts.build_distribution \
              --dist distribution-dist \
              --packs "${{ matrix.packs }}"; then
              break
            fi
            if (( attempt >= 3 )); then
              echo "::error::pack build failed after $attempt attempts"
              exit 1
            fi
            delay=$((attempt * 20))
            echo "::warning::pack build attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
          done
      - name: Preserve complete smoke-build packs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ matrix.artifact }}-${{ needs.prepare-pack-release.outputs.pack_tag }}
          path: distribution-dist/*
          retention-days: 14
      - name: Pass the small platform pack index to the merge job
        uses: actions/upload-artifact@v7
        with:
          name: pack-index-part-${{ matrix.artifact }}-${{ needs.prepare-pack-release.outputs.pack_tag }}
          path: distribution-dist/pack-index-*.json
          retention-days: 1
      - name: Upload packs to the draft immutable pack release
        if: needs.prepare-pack-release.outputs.release_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACK_RELEASE_ID: ${{ needs.prepare-pack-release.outputs.release_id }}
        run: |
          set -euo pipefail
          for file in distribution-dist/*.zip; do
            name="$(basename "$file")"
            gh api --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$PACK_RELEASE_ID/assets?name=$name"
          done

  resolve-pack-index:
    needs: [validate-release, prepare-pack-release, build-distribution-packs]
    if: >-
      always() &&
      needs.prepare-pack-release.result == 'success' &&
      (needs.build-distribution-packs.result == 'success' ||
       needs.build-distribution-packs.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Merge a new pack index
        if: needs.prepare-pack-release.outputs.build_packs == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: pack-index-part-*-${{ needs.prepare-pack-release.outputs.pack_tag }}
          path: pack-index-parts
      - name: Resolve and validate the immutable pack index
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_PACKS: ${{ needs.prepare-pack-release.outputs.build_packs }}
          PACK_RELEASE_ID: ${{ needs.prepare-pack-release.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_PACKS" == "true" ]]; then
            mapfile -t indexes < <(find pack-index-parts -name 'pack-index-*.json' -print | sort)
            args=()
            for index in "${indexes[@]}"; do args+=(--input "$index"); done
            python -m scripts.merge_pack_indexes "${args[@]}" --out pack-index.json
            if [[ -n "$PACK_RELEASE_ID" ]]; then
              gh api --method POST \
                -H 'Content-Type: application/json' \
                --input pack-index.json \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/$PACK_RELEASE_ID/assets?name=pack-index.json"
            fi
          else
            asset_id="$(
              gh api "repos/${{ github.repository }}/releases/$PACK_RELEASE_ID/assets" \
                --jq '.[] | select(.name == "pack-index.json") | .id'
            )"
            test -n "$asset_id"
            gh api -H 'Accept: application/octet-stream' \
              "repos/${{ github.repository }}/releases/assets/$asset_id" \
              > pack-index.json
          fi
          if [[ -n "$PACK_RELEASE_ID" ]]; then
            gh api "repos/${{ github.repository }}/releases/$PACK_RELEASE_ID/assets" \
              > pack-assets.json
            python -m scripts.pack_release validate-index \
              --index pack-index.json \
              --assets-json pack-assets.json
            if [[ "$BUILD_PACKS" == "true" ]]; then
              gh api --method PATCH \
                "repos/${{ github.repository }}/releases/$PACK_RELEASE_ID" \
                -F draft=false \
                -F prerelease=true
            fi
          else
            python -m scripts.pack_release validate-index --index pack-index.json
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pack-index-ready-${{ needs.prepare-pack-release.outputs.pack_tag }}
          path: pack-index.json
          retention-days: 1

  compose-distribution:
    needs: [validate-release, create-release, prepare-pack-release, resolve-pack-index]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pack-index-ready-${{ needs.prepare-pack-release.outputs.pack_tag }}
      - name: Compose the application distribution manifest
        run: |
          python -m scripts.compose_distribution \
            --pack-index pack-index.json \
            --distribution-version "${{ needs.validate-release.outputs.version }}" \
            --out distribution.json
      - name: Preserve an unpublished smoke-build manifest
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: distribution-manifest-${{ needs.validate-release.outputs.release_tag }}
          path: distribution.json
          retention-days: 14
      - name: Upload distribution manifest to the application release
        if: needs.create-release.outputs.release_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api --method POST \
            -H 'Content-Type: application/json' \
            --input distribution.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=distribution.json"

  build:
    needs: [validate-release, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            target: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            target: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
            target: 'x86_64-unknown-linux-gnu'
          - platform: windows-latest
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/my-llm-wiki-browser/frontend/package-lock.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/my-llm-wiki-browser -> target
      - name: Install frontend dependencies
        working-directory: apps/my-llm-wiki-browser/frontend
        run: npm ci
      - name: Build shared CLI and stage Tauri sidecar
        run: python scripts/stage_cli.py --target "${{ matrix.target }}" --dist cli-dist
      - name: Build and upload platform bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/my-llm-wiki-browser/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && needs.validate-release.outputs.release_tag || '' }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}
      - name: Preserve unpublished smoke-build CLI
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}-${{ needs.validate-release.outputs.release_tag }}
          path: cli-dist/*.zip
          retention-days: 14
      - name: Upload standalone CLI to the application release
        if: needs.create-release.outputs.release_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          for file in cli-dist/*.zip; do
            name="$(basename "$file")"
            gh api --method POST \
              -H 'Content-Type: application/zip' \
              --input "$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$name"
          done
      - name: Package and upload the Windows portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = Get-Content apps/my-llm-wiki-browser/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $release = 'apps/my-llm-wiki-browser/target/release'
          $exe = @('My LLM Wiki Browser.exe', 'llm-wiki-desktop.exe') |
            ForEach-Object { Join-Path $release $_ } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $exe) { throw "app exe not found under $release" }
          $portable = Join-Path $release 'portable/My LLM Wiki Browser'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item $exe (Join-Path $portable 'My LLM Wiki Browser.exe')
          Copy-Item apps/my-llm-wiki-browser/desktop/src-tauri/binaries/my-llm-wiki-x86_64-pc-windows-msvc.exe `
            (Join-Path $portable 'my-llm-wiki-x86_64-pc-windows-msvc.exe')
          Copy-Item -Recurse apps/my-llm-wiki-browser/frontend/dist (Join-Path $portable 'frontend')
          Set-Content -Path (Join-Path $portable 'portable.flag') -Value 'portable'
          $zip = "My-LLM-Wiki-Browser_$($conf.version)_x64-portable.zip"
          Compress-Archive -Path $portable -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $required = @(
              'My LLM Wiki Browser.exe',
              'my-llm-wiki-x86_64-pc-windows-msvc.exe',
              'frontend/index.html',
              'frontend/setup.html',
              'portable.flag'
            )
            foreach ($name in $required) {
              if (-not ($entries | Where-Object { $_.EndsWith($name) })) {
                throw "portable archive is missing $name"
              }
            }
          } finally {
            $archive.Dispose()
          }
          if ($env:RELEASE_ID) {
            curl.exe -sSf -X POST `
              -H "Authorization: Bearer $env:GITHUB_TOKEN" `
              -H "Content-Type: application/zip" `
              --data-binary "@$zip" `
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=$zip"
          }
      - name: Collect unpublished smoke-build Browser bundles
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          output = Path("browser-smoke-dist")
          output.mkdir()
          paths = [Path(value) for value in json.loads(os.environ["ARTIFACT_PATHS"])]
          paths.extend(Path.cwd().glob("My-LLM-Wiki-Browser_*_x64-portable.zip"))
          for source in paths:
              if source.is_file():
                  shutil.copy2(source, output / source.name)
              elif source.is_dir():
                  shutil.copytree(source, output / source.name)
              else:
                  raise SystemExit(f"Tauri artifact is missing: {source}")
          if not any(output.iterdir()):
              raise SystemExit("Tauri returned no Browser artifacts")
          PY
      - name: Preserve unpublished smoke-build Browser bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.target }}-${{ needs.validate-release.outputs.release_tag }}
          path: browser-smoke-dist/
          retention-days: 14

  assemble-updater:
    needs: [validate-release, create-release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download signatures and build latest.json once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir updater-signatures
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" > assets.json
          while IFS=$'\t' read -r asset_id name; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/${{ github.repository }}/releases/assets/$asset_id" \
              > "updater-signatures/$name"
          done < <(jq -r '.[] | select(.name | endswith(".sig")) | [.id, .name] | @tsv' assets.json)
          python -m scripts.build_updater_manifest \
            --release-tag "$RELEASE_TAG" \
            --repository "${{ github.repository }}" \
            --assets-json assets.json \
            --signatures updater-signatures \
            --out latest.json
          gh api --method POST \
            -H 'Content-Type: application/json' \
            --input latest.json \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=latest.json"

  publish-release:
    needs:
      - validate-release
      - create-release
      - prepare-pack-release
      - compose-distribution
      - assemble-updater
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify the exact release asset set and manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          PACK_VERSION: ${{ needs.prepare-pack-release.outputs.pack_version }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets")"
          printf '%s' "$assets" > assets.json
          for name in latest.json distribution.json; do
            asset_id="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' assets.json)"
            test -n "$asset_id"
            gh api -H 'Accept: application/octet-stream' \
              "repos/${{ github.repository }}/releases/assets/$asset_id" > "$name"
          done
          python - <<'PY'
          import json
          import os

          version = os.environ["RELEASE_VERSION"]
          pack_version = os.environ["PACK_VERSION"]
          latest = json.load(open("latest.json"))
          expected_updater_platforms = {
              "darwin-aarch64",
              "darwin-aarch64-app",
              "darwin-x86_64",
              "darwin-x86_64-app",
              "linux-x86_64",
              "linux-x86_64-appimage",
              "linux-x86_64-deb",
              "windows-x86_64",
              "windows-x86_64-nsis",
          }
          if latest.get("version") != version:
              raise SystemExit("updater version differs from release")
          if set(latest.get("platforms", {})) != expected_updater_platforms:
              raise SystemExit("updater platform set differs")

          distribution = json.load(open("distribution.json"))
          for key in ("distribution_version", "browser_version", "skills_pack_version"):
              if distribution.get(key) != version:
                  raise SystemExit(f"{key} differs from release")
          if distribution.get("pack_version") != pack_version:
              raise SystemExit("pack version differs from immutable release")
          identities = {
              (row["id"], row["platform"], row["architecture"])
              for row in distribution.get("artifacts", [])
          }
          targets = {
              ("darwin", "arm64"),
              ("darwin", "x64"),
              ("linux", "x64"),
              ("windows", "x64"),
          }
          expected = {
              (pack, platform, architecture)
              for pack in ("toolchain-base", "asr-other")
              for platform, architecture in targets
          }
          expected |= {
              ("asr-zh", platform, architecture)
              for platform, architecture in targets
              if (platform, architecture) != ("darwin", "x64")
          }
          if identities != expected:
              raise SystemExit("distribution artifact set differs")
          for row in distribution["artifacts"]:
              if row["version"] != pack_version:
                  raise SystemExit("artifact version differs from pack release")
              if any(f"/packs-v{pack_version}/" not in url for url in row["urls"]):
                  raise SystemExit("artifact URL does not use immutable pack release")

          expected_assets = {
              "distribution.json",
              "latest.json",
              f"My-LLM-Wiki-Browser_{version}_x64-portable.zip",
              f"My-LLM-Wiki-CLI_{version}_darwin_arm64.zip",
              f"My-LLM-Wiki-CLI_{version}_darwin_x64.zip",
              f"My-LLM-Wiki-CLI_{version}_linux_x64.zip",
              f"My-LLM-Wiki-CLI_{version}_windows_x64.zip",
              f"My.LLM.Wiki.Browser_{version}_aarch64.dmg",
              f"My.LLM.Wiki.Browser_{version}_x64.dmg",
              "My.LLM.Wiki.Browser_aarch64.app.tar.gz",
              "My.LLM.Wiki.Browser_aarch64.app.tar.gz.sig",
              "My.LLM.Wiki.Browser_x64.app.tar.gz",
              "My.LLM.Wiki.Browser_x64.app.tar.gz.sig",
              f"My.LLM.Wiki.Browser_{version}_amd64.AppImage",
              f"My.LLM.Wiki.Browser_{version}_amd64.AppImage.sig",
              f"My.LLM.Wiki.Browser_{version}_amd64.deb",
              f"My.LLM.Wiki.Browser_{version}_amd64.deb.sig",
              f"My.LLM.Wiki.Browser_{version}_x64-setup.exe",
              f"My.LLM.Wiki.Browser_{version}_x64-setup.exe.sig",
          }
          asset_names = {row["name"] for row in json.load(open("assets.json"))}
          if asset_names != expected_assets:
              raise SystemExit(
                  f"release asset mismatch; missing={sorted(expected_assets - asset_names)}, "
                  f"extra={sorted(asset_names - expected_assets)}"
              )
          print({
              "application_assets": len(asset_names),
              "pack_version": pack_version,
              "distribution_artifacts": len(identities),
          })
          PY
      - name: Publish only after every platform and manifest succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false
