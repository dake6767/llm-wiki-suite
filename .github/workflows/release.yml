name: release

# 打 tag（v* ）时构建各平台安装包并发到 GitHub Release（草稿，需手动发布）。
# 也可在 Actions 页手动触发（workflow_dispatch）做一次冒烟构建（只构建，不发布）。
#
# 本仓库是 monorepo：Tauri 工程在 apps/my-llm-wiki-browser/desktop（内含 src-tauri），
# 前端在 apps/my-llm-wiki-browser/frontend。tauri.conf.json 的 beforeBuildCommand
# 会 `cd ../frontend && npm run build`，所以下面预先在 frontend 里 `npm ci` 装依赖。
#
# Release 由前置 create-release job 统一创建（或复用已有的同 tag 草稿），矩阵 job 只
# 往这个 releaseId 传产物。若让 tauri-action 各自按 tagName 建 release，4 个 job 并发
# 查不到彼此刚建的草稿，会给同一个 tag 建出多个半份产物的草稿（v1.0.1 踩过）。
#
# 未做签名：macOS 未做 Developer ID 签名/公证，Windows 未做代码签名，用户首次运行
# 需手动放行。要签名时在仓库 Secrets 加证书，再给 tauri-action 传对应 env（见 tauri
# 官方 “App Signing” 文档），无需改动矩阵结构。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      release_upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create or reuse draft release
        id: create
        # 冒烟构建（workflow_dispatch）不建 release，输出空串，后续按 build-only 走。
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              if (!existing.draft) {
                throw new Error(`refusing to mutate published release ${tag}`);
              }
              core.info(`reusing release ${existing.id} for ${tag}`);
              core.setOutput('upload_url', existing.upload_url);
              return existing.id;
            }
            const { data: created } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `My LLM Wiki ${tag}`,
              // macOS 产物是完整 ad-hoc 签名（无 Developer ID/公证），浏览器下载会带
              // quarantine：Gatekeeper 提示「无法验证开发者」，需到系统设置里「仍要打开」；
              // 右键打开对这种情况不适用（老文案误导，v1.0.5 起修正）。脚本/更新器下载
              // 不带 quarantine，无此步。
              body: 'Protocol 5 由 agent 一次呈现宿主、skills、受管组件与 Browser 选项，确认后通过 inspect/plan/apply 无人值守安装。Windows agent 使用 My-LLM-Wiki-Setup.exe 的 headless 命令，不要求 Git、Python、Node、npm、pip、winget 或 Git Bash；GUI 仅作为恢复入口。macOS/Linux 组件是本 Release 中按平台构建并经 SHA-256 固定的私有运行时包，不调用全局 pip/npm/brew/sudo。Browser 仍提供各平台安装包，Windows 另有 portable zip（需 WebView2）。产物未做 Apple 公证 / Windows Authenticode 代码签名：macOS 首次运行按系统提示到 隐私与安全性 → 仍要打开；Windows SmartScreen 选择仍要运行。',
              draft: true,
              prerelease: false,
            });
            core.setOutput('upload_url', created.upload_url);
            return created.id;

  build-windows-setup:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Setup builder
        shell: pwsh
        run: |
          $lock = Get-Content registry/windows-toolchain.lock.json -Raw | ConvertFrom-Json
          python -m pip install --disable-pip-version-check --no-input "pyinstaller==$($lock.build.pyinstaller)"
      - name: Build pinned Setup and component packs
        shell: pwsh
        run: |
          python scripts/build_windows_setup.py `
            --release-tag "${{ github.ref_name }}" `
            --dist windows-setup-dist
          $rows = Get-ChildItem windows-setup-dist -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $rows | Set-Content windows-setup-dist/SHA256SUMS-windows-setup.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-setup-${{ github.ref_name }}
          path: windows-setup-dist/*
          retention-days: 14
      - name: Upload Setup assets to draft release
        if: needs.create-release.outputs.release_id != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh api "repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets" | ConvertFrom-Json
          Get-ChildItem windows-setup-dist -File | ForEach-Object {
            $file = $_
            $asset = $existing | Where-Object { $_.name -eq $file.Name } | Select-Object -First 1
            if ($asset) {
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$($asset.id)"
            }
            $name = [Uri]::EscapeDataString($file.Name)
            curl.exe -sSf -X POST `
              -H "Authorization: Bearer $env:GITHUB_TOKEN" `
              -H "Content-Type: application/octet-stream" `
              --data-binary "@$($file.FullName)" `
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=$name"
          }

  build-agent-components:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            components: documents,web,video,asr-zh,asr-other
          - os: macos-15
            artifact: darwin-arm64
            components: documents,web,video,asr-zh,asr-other
          - os: macos-15-intel
            artifact: darwin-x64
            components: documents,web,video,asr-other
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Build and postcheck managed agent components
        run: |
          python3 scripts/build_agent_components.py \
            --release-tag "${{ github.ref_name }}" \
            --dist agent-component-dist \
            --components "${{ matrix.components }}"
      - name: Write component checksums
        shell: bash
        run: |
          cd agent-component-dist
          shasum -a 256 * > "SHA256SUMS-agent-components-${{ matrix.artifact }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-components-${{ matrix.artifact }}-${{ github.ref_name }}
          path: agent-component-dist/*
          retention-days: 14
      - name: Upload component assets to draft release
        if: needs.create-release.outputs.release_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets")"
          for file in agent-component-dist/*; do
            name="$(basename "$file")"
            asset_id="$(printf '%s' "$existing" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -1)"
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
            fi
            gh api --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$name"
          done

  build:
    needs: create-release
    permissions:
      contents: write # tauri-action 上传产物需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest   # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest   # Intel（macos-latest 交叉编译到 x86_64）
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/my-llm-wiki-browser/frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/my-llm-wiki-browser -> target

      - name: Install frontend dependencies
        working-directory: apps/my-llm-wiki-browser/frontend
        run: npm ci

      - name: Build and release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 产物签名（minisign）：createUpdaterArtifacts 开启后必须提供私钥，
          # tauri-action 会把各平台 .sig 汇总成 latest.json 一并传到 Release。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/my-llm-wiki-browser/desktop
          # 空 releaseId（冒烟构建）时 tauri-action 只构建不上传。
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Windows 免安装（portable）包：应用在磁盘上就是 exe + frontend/ 资源目录
      # （tauri.conf.json bundle.resources 把 frontend/dist 装到 exe 旁的 frontend/，
      # 运行期经 BaseDirectory::Resource 解析），所以把这两样打成 zip 即可免安装运行。
      # 上传走 uploads.github.com + releaseId，因为草稿 Release 无法用 gh 按 tag 定位。
      - name: Package and upload Windows portable zip
        if: matrix.platform == 'windows-latest' && needs.create-release.outputs.release_id != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = Get-Content apps/my-llm-wiki-browser/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $release = 'apps/my-llm-wiki-browser/target/release'
          # tauri v2 会把主二进制按 productName 改名；兜底用 crate 名。
          $exe = @('My LLM Wiki Browser.exe', 'llm-wiki-desktop.exe') |
            ForEach-Object { Join-Path $release $_ } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $exe) { throw "app exe not found under $release" }
          $portable = Join-Path $release 'portable/My LLM Wiki Browser'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item $exe (Join-Path $portable 'My LLM Wiki Browser.exe')
          Copy-Item -Recurse apps/my-llm-wiki-browser/frontend/dist (Join-Path $portable 'frontend')
          # portable 标记：应用运行期据此判定便携模式，更新面板只提示新版本、不原地安装
          # （portable 没有安装器，updater 的 NSIS 更新流程不适用）。
          Set-Content -Path (Join-Path $portable 'portable.flag') -Value 'portable'
          $zip = "My-LLM-Wiki-Browser_$($conf.version)_x64-portable.zip"
          Compress-Archive -Path $portable -DestinationPath $zip -Force
          curl.exe -sSf -X POST `
            -H "Authorization: Bearer $env:GITHUB_TOKEN" `
            -H "Content-Type: application/zip" `
            --data-binary "@$zip" `
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=$zip"
