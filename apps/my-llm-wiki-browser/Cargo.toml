[workspace]
members = [
    "crates/llm-wiki-core",
    "crates/llm-wiki-setup",
    "crates/llm-wiki-server",
    "crates/llm-wiki-connector",
    "crates/llm-wiki-mcp",
    "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "2.0.12"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs2 = "0.4"
futures-util = "0.3"
hmac = "0.12"
http = "1.4"
include_dir = "0.7"
notify = "8.2"
notify-debouncer-mini = "0.7"
open = "5.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = "1.0"
sha2 = "0.10"
tempfile = "3.25"
tauri = "2.9"
tauri-build = "2.4"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
url = "2.5"
wait-timeout = "0.2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
