[package]
name = "llm-wiki-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arboard = "3"
base64.workspace = true
dirs.workspace = true
getrandom = "0.3"
llm-wiki-core = { path = "../../crates/llm-wiki-core" }
llm-wiki-connector = { path = "../../crates/llm-wiki-connector" }
llm-wiki-server = { path = "../../crates/llm-wiki-server" }
llm-wiki-setup = { path = "../../crates/llm-wiki-setup" }
open.workspace = true
# tauri::generate_context! 为 plugins.updater 配置生成的代码引用 crate 根的 serde_json
serde_json.workspace = true
serde.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[build-dependencies]
tauri-build.workspace = true
