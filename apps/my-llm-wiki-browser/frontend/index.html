<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 应用挂载点：根部署为 /；经路径分租户中继时由 Worker 改写为 /<uid>/。
         所有相对资源（./assets/*）据此解析，深链刷新也不错位（docs/06 §5.4）。 -->
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>My LLM Wiki</title>
    <!-- 单色 SVG 图标：内嵌样式随系统深浅色取墨/纸色；相对路径经 <base> 解析，分租户下亦可达 -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
